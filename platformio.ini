; PlatformIO Project Configuration File for ESP32-C3 Smart Cup Stand
; Targets:
;   - esp32-c3-devkitm-1 : Embedded firmware & Wokwi simulation
;   - native             : Host unit test execution via Unity

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32 @ 6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DPIN_OLED_SDA=4
    -DPIN_OLED_SCL=5
    -DPIN_HX711_DT=6
    -DPIN_HX711_SCK=7
    -DPIN_STATUS_LED=3
    -DHX711_SCALE_FACTOR=0.42f
lib_deps =
    bogde/HX711 @ ^0.7.5
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.2.1

[env:native]
platform = native
test_framework = unity
test_ignore = e2e
build_flags = 
    -std=c++17
    -DUNIT_TEST
    -DDEBUG
build_src_filter = -<*>

